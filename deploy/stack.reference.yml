# Single source of truth for the Portainer stack (Portainer is hand-edited; keep this in sync).
# Push to the registry via 10.50.100.103:8080 (build-push.sh); Portainer pulls via registry.avuz.app — same registry.
version: '3.8'

services:
  roundcube:
    image: registry.avuz.app/admin/avuz-roundcube:staging
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - redis
      - broker
      - postgres
      - imapproxy
    volumes:
      - roundcube_temp:/var/www/roundcube/temp
      - roundcube_logs:/var/www/roundcube/logs
    environment:
      # IMAP_USE_PROXY=1 routes IMAP through the imapproxy sidecar (warm, cached
      # connections to Zoho). Unset/0 = direct ssl://imap.zoho.com:993.
      # See config/config.inc.php:11-34.
      - IMAP_USE_PROXY=1
      - ROUNDCUBE_DB_DSN=pgsql://roundcube:${ROUNDCUBE_PG_PASSWORD}@postgres/roundcube
      - ROUNDCUBE_DES_KEY=$ROUNDCUBE_DES_KEY
      - ROUNDCUBE_SSO_SECRET=$ROUNDCUBE_SSO_SECRET
      - ROUNDCUBE_CREDENTIAL_KEY=$ROUNDCUBE_CREDENTIAL_KEY
      - AVUZ_BROKER_URL=http://broker:9000
      - AVUZ_BROKER_SECRET=$AVUZ_BROKER_SECRET
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  broker:
    image: registry.avuz.app/admin/avuz-password-broker:staging
    restart: unless-stopped
    # NO ports — internal compose network only
    environment:
      - PORT=9000
      - BROKER_SHARED_SECRET=$AVUZ_BROKER_SECRET
      # ZOHO_TENANTS: JSON map of domain -> Zoho org credentials. Optional
      # per-tenant "forcePasswordChange" (bool) toggles the forced first-login
      # password change for that domain (absent = true). Example:
      # {"client-a.com":{"clientId":"..","clientSecret":"..","refreshToken":"..","zoid":"..","forcePasswordChange":false}}
      - ZOHO_TENANTS=$ZOHO_TENANTS
      - ZOHO_IMAP_HOST=imap.zoho.com
      - ZOHO_IMAP_PORT=993

  # IMAP connection-caching proxy. Roundcube connects to imapproxy:143 (plaintext,
  # internal network only); stunnel inside the container terminates TLS to
  # imap.zoho.com:993. Eliminates the TCP+TLS handshake + LOGIN that PHP-FPM would
  # otherwise repeat on every HTTP request. Built from docker/imapproxy-sidecar/
  # by build-push.sh. See docs/superpowers/specs/2026-06-30-roundcube-latency-design.md.
  imapproxy:
    image: registry.avuz.app/admin/avuz-imapproxy-sidecar:staging
    restart: unless-stopped
    # NO ports — internal compose network only (prod publishes none either)

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - roundcube_redis:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=roundcube
      - POSTGRES_DB=roundcube
      - POSTGRES_PASSWORD=${ROUNDCUBE_PG_PASSWORD}
    volumes:
      - roundcube_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roundcube -d roundcube"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  roundcube_temp:
  roundcube_logs:
  roundcube_redis:
  roundcube_pg:
