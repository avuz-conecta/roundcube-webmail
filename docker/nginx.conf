server {
    listen 80;
    server_name _;
    root /var/www/roundcube;
    index index.php;

    client_max_body_size 25M;

    # Security headers
    add_header Content-Security-Policy "frame-ancestors https://*.avuz.app" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block access to sensitive directories
    location ~ ^/(config|logs|temp|bin|SQL|tests|vendor|public_html|composer\.(json|lock)) {
        deny all;
        return 404;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }

    # PHP
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # TLS is terminated at the upstream proxy; tell PHP the request is HTTPS
        # so Roundcube marks the SameSite=None session cookie Secure (else the
        # browser drops it and login fails before IMAP is ever contacted).
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
