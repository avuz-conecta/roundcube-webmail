; Loaded after roundcube.ini (conf.d is read alphabetically, zz- sorts last), so
; anything set here wins over the base image's defaults.

; Per-request timing keyed by Roundcube session. See docker/perf-prepend.php.
auto_prepend_file=/usr/local/etc/php/perf-prepend.php

; NOT changed here, deliberately: max_execution_time stays at the base image's
; 120s. Lowering it to match the 90s upstream-proxy timeout would reclaim worker
; time on abandoned requests, but nginx already drops the upstream connection
; when the client goes away, and a hard 90s cap risks killing PHP in the middle
; of an SMTP send. Revisit only with evidence that workers survive client aborts.
