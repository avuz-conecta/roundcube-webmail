# Backend is the local stunnel (already TLS to Zoho), so plaintext to 127.0.0.1:9993.
server_hostname 127.0.0.1
server_port 9993
listen_address 0.0.0.0
listen_port 143

cache_size 200
# Idle backend connections to Zoho are released after this many seconds. All
# users share one proxy egress IP, so long retention lets idle connections
# accumulate toward Zoho's per-IP ceiling and Zoho throttles the IP — the
# recurring "up N days -> slow, restart -> fast" pattern. 300s (5 min) keeps
# active users' connections warm while reaping idle ones fast. Was 1800.
cache_expiration_time 300
enable_select_cache no

# Keep imapproxy's own sockets alive too, so a dead upstream is noticed.
send_tcp_keepalives yes

# Required-or-it-exits directives (learned the hard way on the Alpine build):
foreground_mode true
# Keep OFF: protocol_log records the LOGIN command incl. the password. Only ever
# flip to a real path on a throwaway staging box for diagnosis, never on prod.
protocol_log_filename /dev/null
stat_filename /var/run/imapproxy/imapproxy.stat
proc_username nobody
proc_groupname nogroup

connect_retries 2
connect_timeout 10
