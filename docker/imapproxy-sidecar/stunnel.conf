foreground = yes
output = /dev/stdout
syslog = no
pid =

# Drop tunnels idle longer than this so a connection cannot sit half-open in
# imapproxy's cache long enough to be reused dead. Below imapproxy's
# cache_expiration_time (300s) on purpose.
TIMEOUTidle = 200

[imap-zoho]
client = yes
accept = 127.0.0.1:9993
connect = imappro.zoho.com:993
verifyChain = yes
CAfile = /etc/ssl/certs/ca-certificates.crt
checkHost = imappro.zoho.com
sslVersionMin = TLSv1.2
# TCP keepalives on the network hop to Zoho. Without these a NAT/firewall can
# silently drop an idle connection, leaving it half-open; imapproxy then reuses
# a dead connection and the client hangs until imap_timeout (15s). Keepalives
# make the OS probe idle connections and tear a dead one down in ~90s, so
# imapproxy sees it closed and opens a fresh one instead of hanging.
socket = a:SO_KEEPALIVE=1
socket = r:TCP_KEEPIDLE=60
socket = r:TCP_KEEPINTVL=15
socket = r:TCP_KEEPCNT=3
