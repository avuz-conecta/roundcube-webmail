server_hostname 127.0.0.1
server_port 9993
listen_address 127.0.0.1
listen_port 1143
cache_size 200
cache_expiration_time 60
enable_select_cache no
force_tls no
connect_retries 2
connect_timeout 10
foreground_mode true
# Required by this build: unset → open(NULL) → exit 1 (silent, logs to syslog).
# protocol log is a plain append (/dev/null ok); stat file is mmap'd → must be a
# real writable file (ftruncate fails on /dev/null), distinct per instance.
protocol_log_filename /dev/null
stat_filename /var/run/imapproxy-zoho.stat
# proc_username/groupname required: imapproxy drops privileges post-bind via
# getpwnam(); unset → getpwnam(NULL) → UID 0 error → exit 1. www-data exists
# (php-fpm/nginx user); stat file is opened as root before the drop.
proc_username www-data
proc_groupname www-data
