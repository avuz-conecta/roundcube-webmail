; PHP-FPM pool — replaces the www.conf generated in Dockerfile.base.
; Kept as a real file (not a sed in the Dockerfile) so the pool is readable and
; reviewable in one place; the app image COPYs it over the base version.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
clear_env = no

pm = dynamic

; 40, raised from 30. Measured on prod (7.9GB host): a worker's RSS is ~28MB,
; most of it shared opcache — so 40 workers cost ~1.1GB against 3.6GB free, not
; the ~4GB the old 100MB/worker estimate assumed. Peak concurrency hit exactly
; 30 (the old ceiling) during business hours, so the ceiling was binding.
; NOTE: workers here are blocked on Zoho I/O, not CPU (the host has 20 cores),
; which is why adding them helps. The cost is more concurrent IMAP connections
; toward Zoho — watch errors.log for block/BYE messages after raising this.
pm.max_children = 40

; The pool used to idle at 5 and fork its way up during a burst, adding latency
; at exactly the moment the box is already slow. Start warm and keep a wider
; spare band so a burst is absorbed by existing workers.
pm.start_servers = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 20

; 500 -> 2000: each recycle re-warms opcache for that worker. Roundcube has no
; known leak that 500 was guarding against.
pm.max_requests = 2000

; Active workers + listen queue, scraped from inside the container:
;   curl -s localhost/fpm-status?full
; nginx only exposes this to 127.0.0.1 (see docker/nginx.conf).
pm.status_path = /fpm-status

; Dump the PHP stack of any request slower than 5s. This is the instrument that
; answers *why* refresh averages ~4.5s and check-recent ~43s — without it we can
; only see the duration, not where it goes.
slowlog = /var/www/roundcube/logs/php-slow.log
request_slowlog_timeout = 5s
