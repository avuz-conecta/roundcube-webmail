<roundcube:include file="includes/layout.html" />
<roundcube:include file="includes/menu.html" />
<roundcube:include file="includes/settings-menu.html" />

<h1 class="voice"><roundcube:label name="settings" /> : <roundcube:label name="avuz_filters.filters" /></h1>

<!-- filters list -->
<div id="layout-list" class="listbox selected">
	<div class="header">
		<a class="button icon back-sidebar-button" href="#sidebar"><span class="inner"><roundcube:label name="settings" /></span></a>
		<span class="header-title"><roundcube:label name="avuz_filters.filters" /></span>
		<a class="button icon toolbar-menu-button" href="#list-menu"><span class="inner"><roundcube:label name="menu" /></span></a>
	</div>
	<div class="scroller">
		<roundcube:object name="avuzfilterslist" id="avuz-filterslist" class="listing" noheader="true"
			role="listbox" data-label-msg="avuz_filters.nofilters" data-create-command="plugin.avuz_filters.add" />
	</div>
</div>

<!-- filter details -->
<div id="layout-content" role="main">
	<div class="header" role="toolbar">
		<a class="button icon back-list-button" href="#back"><span class="inner"><roundcube:label name="back" /></span></a>
		<span class="header-title"></span>
		<div class="toolbar menu">
			<roundcube:button command="plugin.avuz_filters.add" type="link"
				label="create" title="avuz_filters.addfilter" innerClass="inner"
				class="create disabled" classAct="create" data-fab="true" />
			<roundcube:button command="plugin.avuz_filters.del" type="link"
				label="delete" title="delete" innerClass="inner"
				class="delete disabled" classAct="delete" />
			<roundcube:button command="plugin.avuz_filters.apply_existing" type="link"
				label="avuz_filters.applyexisting" title="avuz_filters.applyexisting" innerClass="inner"
				class="button reload" />
		</div>
	</div>

	<div class="formcontent" id="avuz-filter-editor" style="display:none">
		<fieldset class="propform">
			<legend><roundcube:label name="avuz_filters.filter" /></legend>
			<div class="form-group row">
				<label class="col-form-label col-sm-4" for="af-name"><roundcube:label name="avuz_filters.filtername" /></label>
				<div class="col-sm-8"><input type="text" id="af-name" class="form-control" /></div>
			</div>
			<div class="form-group row">
				<label class="col-form-label col-sm-4" for="af-enabled"><roundcube:label name="avuz_filters.enabled" /></label>
				<div class="col-sm-8"><input type="checkbox" id="af-enabled" value="1" checked="checked" /></div>
			</div>
			<div class="form-group row">
				<label class="col-form-label col-sm-4" for="af-match"><roundcube:label name="avuz_filters.scope" /></label>
				<div class="col-sm-8"><select id="af-match" class="form-control custom-select">
					<option value="all"><roundcube:label name="avuz_filters.matchall" /></option>
					<option value="any"><roundcube:label name="avuz_filters.matchany" /></option>
				</select></div>
			</div>
		</fieldset>

		<h3 class="propform-title"><roundcube:label name="avuz_filters.rules" /></h3>
		<table class="propform records-table" id="af-conditions"><tbody></tbody></table>

		<h3 class="propform-title"><roundcube:label name="avuz_filters.actions" /></h3>
		<table class="propform records-table" id="af-actions"><tbody></tbody></table>

		<div class="formbuttons">
			<input type="button" id="af-save" class="btn btn-primary submit" />
		</div>
	</div>
</div>

<roundcube:include file="includes/footer.html" />
